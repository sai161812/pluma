[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluma"
version = "0.1.0.dev0"
description = "PLUMA — fully local Windows 11 voice and screen-aware agent"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "psutil>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pluma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "-v --tb=short"
