name: Windows UI verification

on:
  pull_request:
    paths:
      - 'PLUMA.UI/**'
      - '.github/workflows/ui-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ui:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build and verify the actual WinUI fixtures
        shell: pwsh
        run: ./PLUMA.UI/verify-ui.ps1
      - name: Save reports and fixture renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ui-verification
          path: output/ui-verification/
          retention-days: 7
          if-no-files-found: error
